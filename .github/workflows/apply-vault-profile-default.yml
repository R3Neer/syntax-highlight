name: Apply vault profile default

on:
  push:
    branches:
      - refactor/per-vault-mud-profile

permissions:
  contents: write

jobs:
  patch-defaults:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make MUD opt-in by default
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path("packages/obsidian/src/settings.ts")
          text = settings.read_text(encoding="utf-8")
          needle = '    id,\n    enabled: true,\n    descriptorPath: "",'
          replacement = '    id,\n    enabled: id !== "mud",\n    descriptorPath: "",'
          if text.count(needle) != 1:
              raise SystemExit(f"expected one defaultProfile enabled marker, found {text.count(needle)}")
          settings.write_text(text.replace(needle, replacement), encoding="utf-8")

          tests = Path("packages/obsidian/tests/settings.test.ts")
          text = tests.read_text(encoding="utf-8")

          needle = '    expect(settings.languages.find(({ id }) => id === "toml")?.enabled).toBe(true);'
          replacement = (
              '    expect(settings.languages.find(({ id }) => id === "mud")?.enabled).toBe(false);\n'
              + needle
          )
          if text.count(needle) != 1:
              raise SystemExit(f"expected one settings assertion marker, found {text.count(needle)}")
          text = text.replace(needle, replacement)

          needle = '''  it("resolves source file extensions through loaded descriptors", () => {
            const registry = new LanguageRegistry(
              structuredClone(DEFAULT_SETTINGS),
              () => Promise.resolve(""),
            );'''
          replacement = '''  it("resolves source file extensions through loaded descriptors", () => {
            const settings = structuredClone(DEFAULT_SETTINGS);
            const mud = settings.languages.find(({ id }) => id === "mud");
            if (mud !== undefined) mud.enabled = true;
            const registry = new LanguageRegistry(
              settings,
              () => Promise.resolve(""),
            );'''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one extension registry marker, found {text.count(needle)}")
          text = text.replace(needle, replacement)

          needle = '''  it("reports active collisions as configuration errors", async () => {
            const settings = structuredClone(DEFAULT_SETTINGS);
            settings.languages[1].embeddedDescriptor = structuredClone('''
          replacement = '''  it("reports active collisions as configuration errors", async () => {
            const settings = structuredClone(DEFAULT_SETTINGS);
            const mud = settings.languages.find(({ id }) => id === "mud");
            if (mud !== undefined) mud.enabled = true;
            settings.languages[1].embeddedDescriptor = structuredClone('''
          if text.count(needle) != 1:
              raise SystemExit(f"expected one collision registry marker, found {text.count(needle)}")
          text = text.replace(needle, replacement)

          tests.write_text(text, encoding="utf-8")
          PY
      - run: npm run check
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/obsidian/src/settings.ts packages/obsidian/tests/settings.test.ts
          git commit -m "refactor(obsidian): make MUD profile opt-in"
          git push
