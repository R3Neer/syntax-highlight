name: Apply vault profile default

on:
  push:
    branches:
      - refactor/per-vault-mud-profile

permissions:
  contents: write

jobs:
  patch-defaults:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make MUD opt-in by default
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path("packages/obsidian/src/settings.ts")
          text = settings.read_text(encoding="utf-8")
          needle = '    id,\n    enabled: true,\n    descriptorPath: "",'
          replacement = '    id,\n    enabled: id !== "mud",\n    descriptorPath: "",'
          if text.count(needle) != 1:
              raise SystemExit(f"expected one defaultProfile enabled marker, found {text.count(needle)}")
          settings.write_text(text.replace(needle, replacement), encoding="utf-8")

          tests = Path("packages/obsidian/tests/settings.test.ts")
          lines = tests.read_text(encoding="utf-8").splitlines()

          toml_assertion = '    expect(settings.languages.find(({ id }) => id === "toml")?.enabled).toBe(true);'
          if lines.count(toml_assertion) != 1:
              raise SystemExit("expected one TOML default assertion")
          index = lines.index(toml_assertion)
          lines.insert(
              index,
              '    expect(settings.languages.find(({ id }) => id === "mud")?.enabled).toBe(false);',
          )

          title = '  it("resolves source file extensions through loaded descriptors", () => {'
          if lines.count(title) != 1:
              raise SystemExit("expected one source extension test")
          start = lines.index(title)
          registry = next(
              i for i in range(start + 1, len(lines))
              if lines[i].strip() == "const registry = new LanguageRegistry("
          )
          end = registry
          while end < len(lines) and lines[end].strip() != ");":
              end += 1
          if end >= len(lines):
              raise SystemExit("could not find end of source extension registry constructor")
          lines[registry:end + 1] = [
              "    const settings = structuredClone(DEFAULT_SETTINGS);",
              '    const mud = settings.languages.find(({ id }) => id === "mud");',
              "    if (mud !== undefined) mud.enabled = true;",
              "    const registry = new LanguageRegistry(",
              "      settings,",
              '      () => Promise.resolve(""),',
              "    );",
          ]

          title = '  it("reports active collisions as configuration errors", async () => {'
          if lines.count(title) != 1:
              raise SystemExit("expected one collision test")
          start = lines.index(title)
          settings_line = next(
              i for i in range(start + 1, len(lines))
              if lines[i].strip() == "const settings = structuredClone(DEFAULT_SETTINGS);"
          )
          lines[settings_line + 1:settings_line + 1] = [
              '    const mud = settings.languages.find(({ id }) => id === "mud");',
              "    if (mud !== undefined) mud.enabled = true;",
          ]

          tests.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - run: npm run check
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/obsidian/src/settings.ts packages/obsidian/tests/settings.test.ts
          git commit -m "refactor(obsidian): make MUD profile opt-in"
          git push
