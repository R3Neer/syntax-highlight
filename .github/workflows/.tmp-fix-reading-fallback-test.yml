name: Fix Reading fallback test typing

on:
  push:
    branches:
      - fix/reading-postprocessor-fallback
    paths:
      - scripts/.tmp-fix-reading-fallback-test.py
      - .github/workflows/.tmp-fix-reading-fallback-test.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reading-postprocessor-fallback
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/.tmp-fix-reading-fallback-test.py
      - run: npm ci
      - run: npm run check
      - run: npm run pack:all
      - name: Commit test repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(obsidian): type Reading fallback host handler explicitly'
          git push origin HEAD:fix/reading-postprocessor-fallback
