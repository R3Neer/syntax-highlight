name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm run pack:all
      - name: Verify npm packages
        run: |
          for package in core language-mud html codemirror mcp cli obsidian; do
            name=$(node -p "require('./packages/$package/package.json').name")
            version=$(node -p "require('./packages/$package/package.json').version")
            npm view "$name@$version" version
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/npm/*.tgz
          packages/obsidian/dist/main.js
          packages/obsidian/dist/manifest.json
          packages/obsidian/dist/styles.css
          --generate-notes
