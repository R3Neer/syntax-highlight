name: Apply optional MUD profile refactor

on:
  push:
    branches:
      - refactor/per-vault-mud-profile

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make MUD an optional stored profile
        run: |
          python - <<'PY'
          from pathlib import Path

          settings_path = Path("packages/obsidian/src/settings.ts")
          text = settings_path.read_text(encoding="utf-8")

          text = text.replace(
              '    enabled: id !== "mud",\n',
              '    enabled: true,\n',
              1,
          )

          marker = '''}\n\nexport const DEFAULT_SETTINGS: SyntaxPluginSettings = {'''
          insert = '''}\n\nconst OPTIONAL_BUILTIN_PROFILES = {\n  mud: defaultProfile("mud", "catppuccin"),\n} as const;\n\nexport const DEFAULT_SETTINGS: SyntaxPluginSettings = {'''
          if text.count(marker) != 1:
              raise SystemExit(f"expected one default settings marker, found {text.count(marker)}")
          text = text.replace(marker, insert, 1)

          mud_line = '    defaultProfile("mud", "catppuccin"),\n'
          if text.count(mud_line) != 1:
              raise SystemExit(f"expected one MUD default line, found {text.count(mud_line)}")
          text = text.replace(mud_line, "", 1)

          old = '''    languages.push(\n      mergeLanguage(entry, genericFallback(id), customThemes, migrateLegacyPaletteValues),\n    );'''
          new = '''    const optionalFallback =\n      id === "mud" ? OPTIONAL_BUILTIN_PROFILES.mud : undefined;\n    const fallback = optionalFallback ?? genericFallback(id);\n    const profileValue =\n      id === "mud"\n        ? migrateMudSemanticProfile(entry, storedSchemaVersion)\n        : entry;\n    languages.push(\n      mergeLanguage(\n        profileValue,\n        fallback,\n        customThemes,\n        migrateLegacyPaletteValues,\n      ),\n    );'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one stored profile merge marker, found {text.count(old)}")
          text = text.replace(old, new, 1)
          settings_path.write_text(text, encoding="utf-8")

          tests_path = Path("packages/obsidian/tests/settings.test.ts")
          text = tests_path.read_text(encoding="utf-8")

          old = '''    const settings = loadSettings(undefined);\n    const mud = settings.languages.find(({ id }) => id === "mud");\n    const ebnf = settings.languages.find(({ id }) => id === "ebnf");'''
          new = '''    const settings = loadSettings({ languages: [{ id: "mud" }] });\n    const mud = settings.languages.find(({ id }) => id === "mud");\n    const ebnf = settings.languages.find(({ id }) => id === "ebnf");\n\n    expect(loadSettings(undefined).languages.some(({ id }) => id === "mud")).toBe(false);'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one default palette setup, found {text.count(old)}")
          text = text.replace(old, new, 1)

          text = text.replace(
              '    expect(settings.languages.find(({ id }) => id === "mud")?.enabled).toBe(false);\n',
              '',
              1,
          )

          old = '''  it("emits separate light and dark rules for real categories", () => {\n    const settings = structuredClone(DEFAULT_SETTINGS);\n    const css = buildThemeCss(settings);'''
          new = '''  it("emits separate light and dark rules for real categories", () => {\n    const settings = loadSettings({ languages: [{ id: "mud" }] });\n    const css = buildThemeCss(settings);'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one theme CSS test setup, found {text.count(old)}")
          text = text.replace(old, new, 1)

          # Tests that exercise MUD behavior must request the optional MUD profile explicitly.
          old = '''    const registry = new LanguageRegistry(\n      structuredClone(DEFAULT_SETTINGS),\n      () => Promise.reject(new Error("broken source")),\n    );'''
          new = '''    const registry = new LanguageRegistry(\n      loadSettings({ languages: [{ id: "mud", enabled: true }] }),\n      () => Promise.reject(new Error("broken source")),\n    );'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one MUD reload test setup, found {text.count(old)}")
          text = text.replace(old, new, 1)

          # Replace hard-coded EBNF indexes now that MUD is no longer the first default profile.
          text = text.replace(
              '    const profile = settings.languages[1];\n    profile.descriptorPath = "languages/ebnf.json";',
              '    const profile = settings.languages.find(({ id }) => id === "ebnf")!;\n    profile.descriptorPath = "languages/ebnf.json";',
          )
          text = text.replace(
              '    settings.languages[1].descriptorPath = "";',
              '    const ebnf = settings.languages.find(({ id }) => id === "ebnf")!;\n    ebnf.descriptorPath = "";',
          )

          old = '''    const settings = structuredClone(DEFAULT_SETTINGS);\n    const mud = settings.languages.find(({ id }) => id === "mud");\n    if (mud !== undefined) mud.enabled = true;\n    const registry = new LanguageRegistry(\n      settings,\n      () => Promise.resolve(""),\n    );\n\n    expect(registry.byExtension(".mud")?.settings.id).toBe("mud");'''
          new = '''    const settings = loadSettings({ languages: [{ id: "mud", enabled: true }] });\n    const registry = new LanguageRegistry(\n      settings,\n      () => Promise.resolve(""),\n    );\n\n    expect(registry.byExtension(".mud")?.settings.id).toBe("mud");'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one MUD extension setup, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    const settings = structuredClone(DEFAULT_SETTINGS);\n    const mud = settings.languages.find(({ id }) => id === "mud");\n    if (mud !== undefined) mud.enabled = true;\n    settings.languages[1].embeddedDescriptor = structuredClone(\n      BUILTIN_DESCRIPTORS.ebnf,\n    );\n    settings.languages[1].embeddedDescriptor.fences = ["mud"];\n    settings.languages[1].descriptorOrigin = "personal";'''
          new = '''    const settings = loadSettings({ languages: [{ id: "mud", enabled: true }] });\n    const ebnf = settings.languages.find(({ id }) => id === "ebnf")!;\n    ebnf.embeddedDescriptor = structuredClone(BUILTIN_DESCRIPTORS.ebnf);\n    ebnf.embeddedDescriptor.fences = ["mud"];\n    ebnf.descriptorOrigin = "personal";'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one collision setup, found {text.count(old)}")
          text = text.replace(old, new, 1)

          tests_path.write_text(text, encoding="utf-8")

          tab_path = Path("packages/obsidian/src/settings-tab.ts")
          text = tab_path.read_text(encoding="utf-8")
          text = text.replace(
              '  private selectedThemeLanguage = "mud";',
              '  private selectedThemeLanguage = "";',
              1,
          )
          old = '''    const themes = this.section(containerEl, tr("Themes", "Temas"), false);\n    new Setting(themes)\n      .setName(tr("Language to customize", "Lenguaje que personalizar"))'''
          new = '''    const themes = this.section(containerEl, tr("Themes", "Temas"), false);\n    if (!this.plugin.pluginSettings.languages.some(({ id }) => id === this.selectedThemeLanguage)) {\n      this.selectedThemeLanguage = this.plugin.pluginSettings.languages[0]?.id ?? "";\n    }\n    new Setting(themes)\n      .setName(tr("Language to customize", "Lenguaje que personalizar"))'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one theme selector marker, found {text.count(old)}")
          text = text.replace(old, new, 1)
          tab_path.write_text(text, encoding="utf-8")
          PY
      - run: npm run check
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/obsidian/src/settings.ts packages/obsidian/tests/settings.test.ts packages/obsidian/src/settings-tab.ts
          git commit -m "refactor(obsidian): keep MUD out of common vault defaults"
          git push
