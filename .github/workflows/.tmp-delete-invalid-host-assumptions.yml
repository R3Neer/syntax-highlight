name: Reviewed deletion phase
on:
  push:
    branches: [fix/obsidian-nested-host-integration]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/obsidian-nested-host-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/.tmp-delete-invalid-host-assumptions.py
      - run: npm ci
      - run: npm run check
      - name: Commit reviewed deletion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/obsidian/src/reading-host.ts packages/obsidian/tests/reading-fallback.test.ts scripts/.tmp-delete-invalid-host-assumptions.py
          git commit -m 'refactor(obsidian): remove invalid host DOM assumption'
          git push
