name: Apply temporary block presentation patch

on:
  push:
    branches:
      - feat/text-markdown-presentation
    paths:
      - scripts/.tmp-apply-text-markdown-presentation.py
      - .github/workflows/.tmp-apply-text-markdown-presentation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/text-markdown-presentation
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/.tmp-apply-text-markdown-presentation.py
      - run: npm ci
      - run: npm run check
      - run: npm run pack:all
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(obsidian): configure Text and Markdown presentation'
          git push origin HEAD:feat/text-markdown-presentation
