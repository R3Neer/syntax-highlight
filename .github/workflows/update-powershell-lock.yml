name: Update PowerShell dependency lock

on:
  push:
    branches:
      - feat/text-furniture-powershell
    paths:
      - package.json
      - .github/workflows/update-powershell-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/text-furniture-powershell
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: refresh lockfile for PowerShell mode'
          git push origin HEAD:feat/text-furniture-powershell
