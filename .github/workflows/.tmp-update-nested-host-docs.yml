name: Update nested host docs
on:
  push:
    branches: [fix/obsidian-nested-host-integration]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/obsidian-nested-host-integration
      - run: python3 scripts/.tmp-update-nested-host-docs.py
      - name: Commit documentation and helper cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(obsidian): document real nested host integration'
          git push
